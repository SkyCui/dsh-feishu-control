# dsh-feishu-control profile layer. Install with:
#   dsh plugin --profile feishu-control add dsh-feishu-control@latest
# Then run:
#   dsh --profile feishu-control
- id: sandbox-policy
  config:
    mode: !!js process.env.FEISHU_CONTROL_PERMISSION_MODE ?? process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.env.FEISHU_CONTROL_WORKSPACE ?? process.env.DSH_FEISHU_WORKSPACE ?? process.cwd()
- insert:
    - id: feishu
      name: 'dsh-feishu-control/feishu'
    - id: feishu-local
      name: 'dsh-feishu-control/feishu-local'
    - id: feishu-agent
      name: 'dsh-feishu-control/feishu-agent'
      config:
        cwd: !!js process.env.FEISHU_CONTROL_WORKSPACE ?? process.env.DSH_FEISHU_WORKSPACE ?? process.cwd()
        allowedOpenIds: !!js "(process.env.FEISHU_CONTROL_ALLOWED_OPEN_IDS ?? process.env.DSH_FEISHU_ALLOWED_OPEN_IDS)?.split(',').map(value => value.trim()).filter(Boolean) ?? []"
        allowGroupChats: false
        requireMentionInGroups: true
        # Optional model route. Each variable pins only its own field; every
        # unset field and reasoning effort follow the profile's live
        # `agent-default-model`; set both to opt into a fully fixed route.
        provider: !!js process.env.FEISHU_CONTROL_PROVIDER
        model: !!js process.env.FEISHU_CONTROL_MODEL
